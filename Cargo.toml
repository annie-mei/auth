[package]
name = "annie-mei-auth"
version = "2.0.1"
edition = "2024"
rust-version = "1.95"
publish = false

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
debug = 2
split-debuginfo = "packed"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
blake3 = "1.8.5"
dotenvy = "0.15.7"
linkify = "0.11"
nanoid = "0.5.0"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rocket = { version = "0.5.1", default-features = false, features = ["json", "secrets"] }
sentry = { version = "0.48.2", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "logs",
  "panic",
  "release-health",
  "rustls",
  "tracing",
  "ureq",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
  "postgres",
  "runtime-tokio-rustls",
  "macros",
  "migrate",
  "chrono",
] }
hmac = "0.13"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
